name: Danger
description: 'Danger, Inc. was a Palo Alto, California mobile computing company founded
  on December 9, 1999 by Andy Rubin, Joe Britt, and Matt Hershenson, all former Apple,
  WebTV, and Philips engineers. Danger built the Danger Hiptop, sold in the United
  States as the T-Mobile Sidekick, an early client-server ("cloud") smartphone whose
  downloadable application catalog prefigured the app stores later shipped by Android
  and iOS. Andy Rubin left Danger in 2003 to found Android. Microsoft acquired Danger
  on February 11, 2008 for a price reported at roughly $500 million and folded the
  team into "Project Pink," which shipped as the short-lived Microsoft Kin. Most former
  Danger staff had left Microsoft by October 2009 and the company was wound down by
  approximately 2011. Danger was surfaced in the API Evangelist network as a historic
  Redpoint Ventures portfolio holding. It is defunct: the danger.com domain no longer
  resolves and there is no developer portal, documentation, or API surface to catalog.'
